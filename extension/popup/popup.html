<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PhishGuard Inspector</title>
  <link rel="stylesheet" href="popup.css">
</head>

  <div class="header">

    <div class="section-title">Telemetry Signals</div>

      <li>Analyzing domain entropy...</li>
      <li>Checking for Punycode homoglyphs...</li>
    </ul>
  </div>

  <div class="footer">
    <span>ENGINE: v1.0.0</span>
    <span>STATUS: ACTIVE</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
