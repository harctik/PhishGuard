<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vanguard</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <img src="mark.svg" alt="" width="30">
      <img src="wordmark.svg" alt="Vanguard" width="104">
    </div>
    <span class="badge idle" id="status-badge">CHECKING</span>
  </header>

  <main>
    <section class="score-card">
      <div class="score-label">Risk score, 0 to 100</div>
      <div class="score-val" id="score-val">--</div>
      <div class="score-sub" id="verdict-label" aria-live="polite">Checking this tab…</div>
    </section>

    <section class="details">
      <h2 class="section-title">What was found</h2>
      <ul id="reasons-list">
        <li>Waiting for the local backend.</li>
      </ul>
    </section>
  </main>

  <footer class="footer">
    <span>Backend: localhost:8000</span>
    <span>v1.0.0</span>
  </footer>

  <script src="../shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
