[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard"
version = "1.0.0"
description = "Real-Time Adversarial Phishing Intelligence and Browser Shield"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Avvari Naga Harthikanand", email = "harthikanand90@gmail.com" }
]
keywords = ["cybersecurity", "phishing-detection", "fastapi", "chrome-extension", "infosec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
